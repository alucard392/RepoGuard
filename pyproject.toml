[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repoguard"
version = "0.1.0"
description = "Local, offline repository hygiene scanner for secrets and common mistakes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RepoGuard contributors"}]
keywords = ["secrets", "scanner", "github", "hygiene", "cli", "tkinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
]

[project.scripts]
repoguard = "repoguard.__main__:main"

[tool.setuptools]
packages = ["repoguard"]
include-package-data = true

[tool.setuptools.package-data]
repoguard = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo", ".pytest_cache/*"]
